<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理报表修订流程</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">📊 管理报表修订平台</div>
    <nav class="nav">
      <button class="nav-btn active" data-view="reports">报表与版本</button>
      <button class="nav-btn" data-view="revisions">修订流程</button>
      <button class="nav-btn" data-view="tasks">复核任务 <span id="task-badge" class="badge hidden"></span></button>
      <button class="nav-btn" data-view="notifications">通知 <span id="ntf-badge" class="badge hidden"></span></button>
      <button class="nav-btn" data-view="audit" id="nav-audit" hidden>审计日志</button>
    </nav>
    <div class="session">
      <span id="user-chip" class="chip hidden"></span>
      <button id="logout-btn" class="btn btn-ghost hidden">退出</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- Login overlay -->
  <div id="login-overlay" class="overlay hidden">
    <div class="modal">
      <h2>选择登录身份</h2>
      <p class="muted">演示环境通过切换身份验证权限控制；所有身份看到的明细与摘要数据保持一致。</p>
      <div id="login-users" class="login-grid"></div>
    </div>
  </div>

  <!-- Generic modal host -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal modal-wide" id="modal-host"></div>
  </div>

  <div id="toast-host"></div>

  <script src="/app.js"></script>
</body>
</html>
